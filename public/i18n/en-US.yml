  browserTest: Browser Quick Test
  browserTestDesc: Use a tokenized URL to quickly verify reachability in the browser.
  automation: Automation Scripts
  automationDesc: Scripts can still use Bearer Token, X-API-Key, or the apiKey query parameter.
  loginInfo: Login Information
  passwordHint: Use your site login password. The plain password is not shown on this page.
  baseEndpoint: Base Endpoint
  poolEndpoints: Storage Pool Endpoints
  poolEndpointsDesc: Generate a dedicated WebDAV URL for each pool so clients do not need to switch context manually.
  loadingPools: Loading storage pools...
  noPools: No storage pools available
  noPoolsHint: Create or verify a default storage pool first from the Storage Pools page.
  clientUrl: Client URL
  browserUrl: Browser Test URL
  tipsTitle: Integration Tips
  tip1: Windows Explorer, macOS Finder, Cyberduck, RaiDrive, and similar clients should prefer the client URL with username/password.
  tip2: For quick endpoint checks, use the browser test URL, which already includes the current login token.
  tip3: Desktop clients should prefer /dav/pool/ID. Without a pool ID, the default storage pool is used.
