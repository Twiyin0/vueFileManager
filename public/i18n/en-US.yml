webdav:
  copied: Copied
  copy: Copy
  title: WebDAV Access
  description: This page centralizes WebDAV URLs, authentication methods, and per-pool endpoints for desktop clients and automation.
  manageApiKey: Manage API Keys
  recommendedTitle: Recommended Access Methods
  desktopClient: Desktop Clients
  desktopClientDesc: Use /dav or /dav/pool/storagePoolId and sign in with your site username and password.
  devHint: In development, connect to the backend on port 3000 directly instead of the frontend on port 5173.
  browserTest: Browser Quick Test
  browserTestDesc: Use a tokenized URL to quickly verify endpoint reachability in the browser.
  automation: Automation Scripts
  automationDesc: Scripts can continue using Bearer Token, X-API-Key, or the apiKey query parameter.
  loginInfo: Login Information
  passwordHint: Use your site login password. This page does not reveal the plaintext password.
  baseEndpoint: Base Endpoint
  poolEndpoints: Storage Pool Endpoints
  poolEndpointsDesc: Generate a dedicated WebDAV URL for each pool so clients do not need to switch context manually.
  loadingPools: Loading storage pools...
  noPools: No storage pools available
  noPoolsHint: Create or verify a default storage pool from the storage pools page first.
  clientUrl: Client URL
  browserUrl: Browser Test URL
  tipsTitle: Integration Tips
  tip1: Windows Explorer, macOS Finder, Cyberduck, RaiDrive, and similar clients should prefer the client URL with username and password.
  tip2: For quick endpoint checks, prefer the browser test URL, which already includes the current login token.
  tip3: Desktop clients should prefer /dav/pool/ID. Without a pool ID, the default storage pool is used.
