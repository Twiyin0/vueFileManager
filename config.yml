# VueFileManager 配置文件

# ============================================================
# 默认管理员账户
# ============================================================
admin:
  username: admin
  # 密码的 MD5 值，默认为 MD5("admin") = 21232f297a57a5a743894a0e4a801fc3
  # 计算方式: echo -n "your-password" | md5
  password: 21232f297a57a5a743894a0e4a801fc3

# ============================================================
# 服务器配置
# ============================================================
server:
  port: 3000
  # JWT 密钥，用于 Token 签名，生产环境请修改
  jwt_secret: vue-file-manager-secret-key-2024

# ============================================================
# 存储配置
# ============================================================
storage:
  # 默认存储类型：local（本地）或 upyun（又拍云）
  default_type: local
  # 本地存储默认路径
  local_path: ./uploads

# ============================================================
# Upyun（又拍云）配置示例
# ============================================================
# 以下为 Upyun 配置示例，实际使用时请在 .env 文件中配置
# 复制 .env.example 为 .env 并填入真实信息
#
# .env 配置格式：
#   ENV_upyun_operator=操作员名称
#   ENV_upyun_password=操作员密码
#   ENV_upyun_bucket=服务名称
#   ENV_upyun_endpoint=API端点（默认 v0.api.upyun.com）
#
# 示例（又拍云控制台获取）：
#   服务名称: upyun-service
#   加速域名: alist.example.com
#   操作员: operator
#   操作员密码: 在又拍云控制台创建
#
# API 端点说明：
#   v0.api.upyun.com  - 默认（自动选择最优节点）
#   v1.api.upyun.com  - 备用
#   v2.api.upyun.com  - 备用
#
# 用户也可以在前端设置页面独立配置自己的 Upyun 存储
