# VueFileManager 配置文件

# ============================================================
# 默认管理员账户
# ============================================================
admin:
  username: admin
  # 密码的 MD5 值，默认为 MD5("admin") = 21232f297a57a5a743894a0e4a801fc3
  # 计算方式: echo -n "your-password" | md5
  password: 21232f297a57a5a743894a0e4a801fc3

# ============================================================
# 服务器配置
# ============================================================
server:
  port: 3000
  # 监听地址，留空则默认 localhost（仅本机访问），0.0.0.0 可从局域网访问
  host: ''
  # JWT 密钥，用于 Token 签名，生产环境请修改
  jwt_secret: vue-file-manager-secret-key-2024

# ============================================================
# 存储池配置
# ============================================================
# 在这里预配置存储池，新注册用户会自动继承这些配置
# 也可以在前端「存储池」页面中管理
#
# 格式说明：
#   name: 存储池名称
#   type: 存储类型 (local / upyun)
#   default: 是否为默认存储池
#   config: 存储配置（根据类型不同）
#
# 本地存储 config：
#   localPath: 本地目录路径
#
# 又拍云 config：
#   upyunOperator: 操作员名称
#   upyunPassword: 操作员密码
#   upyunBucket: 服务名（Bucket）
#   upyunEndpoint: API 端点（默认 v0.api.upyun.com）
storage_pools:
  - name: 本地存储
    type: local
    default: true
    config:
      localPath: ./uploads

  # 又拍云示例（取消注释并填入真实信息）
  # - name: 又拍云存储
  #   type: upyun
  #   default: false
  #   config:
  #     upyunOperator: your-operator
  #     upyunPassword: your-password
